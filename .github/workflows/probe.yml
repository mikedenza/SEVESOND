name: Sonda dati Seveso

on:
  schedule:
    - cron: "*/10 * * * *"   # ogni 10 minuti (UTC); GitHub può ritardare
  workflow_dispatch: {}       # avvio manuale dalla scheda Actions

permissions:
  contents: write             # serve per salvare i dati nel repository

concurrency:
  group: probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5

      - name: Esegui la sonda
        env:
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
          SOCRATA_KEY_ID: ${{ secrets.SOCRATA_KEY_ID }}
          SOCRATA_KEY_SECRET: ${{ secrets.SOCRATA_KEY_SECRET }}
          PROBE_FULL: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: python3 probe.py

      - name: Salva i risultati
        run: |
          git config user.name "seveso-probe"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "sonda $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull -q --rebase
          git push -q
